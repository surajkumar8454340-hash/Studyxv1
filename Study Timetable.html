<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Timetable</title>
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Daily study timetable with live timer, topic checklist and mock score log">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--card:#121620;--card2:#181d29;--ink:#edeff5;--mute:#8c94a6;--line:#232938;--acc:#7b8cff;
--maths:#e5b44a;--reas:#e8825f;--hindi:#e07aa0;--polity:#6fa2f0;--chem:#4dbfa4;--geo:#8cc268;--meal:#a58be0;--rout:#7a859c;--test:#ef6a6a;--phy:#ee9a52;--brk:#2c3342;
--f:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--n:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--r:14px;--sw:6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-skin="anime"]){--bg:#f3f5f9;--card:#fff;--card2:#fff;--ink:#12151c;--mute:#5a6376;--line:#e3e7ef;--acc:#4256e8;
--maths:#b57d00;--reas:#c2521f;--hindi:#c23a74;--polity:#2559c4;--chem:#0c8a70;--geo:#4a8a1c;--meal:#7442c9;--rout:#66728c;--test:#d03838;--phy:#c75f12;--brk:#d3d8e6}}
:root[data-theme="dark"]{--bg:#0b0d12}
:root[data-skin="anime"]{--bg:#0a0618;--card:rgba(40,24,98,.55);--card2:rgba(52,32,120,.62);--ink:#fff2fa;--mute:#b9a9e6;--line:rgba(255,255,255,.12);--acc:#ff8fcf;
--maths:#ffd166;--reas:#ff8fa3;--hindi:#ff79c6;--polity:#6be9ff;--chem:#5ef2c0;--geo:#b8f27b;--meal:#d0a8ff;--rout:#a79bef;--test:#ff5c8a;--phy:#ffa94d;--brk:rgba(255,255,255,.14);
--f:"Zen Maru Gothic","Manrope",system-ui,sans-serif;--r:20px;--sw:8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.35;font-variant-numeric:tabular-nums}
:root[data-skin="anime"] body,:root[data-skin="anime"] .sheet{background:radial-gradient(500px 360px at 100% 0,#7a2fc455,transparent),radial-gradient(520px 420px at 0 38%,#ff6fb52e,transparent),linear-gradient(#170c36,#0a0618 60%) fixed}
:root[data-skin="anime"] body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
background:radial-gradient(circle at 72% 38px,#fff0f8 0 15px,#ff9ad166 16px 36px,transparent 110px),
radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 80px,#cfe,transparent),radial-gradient(1.5px 1.5px at 140px 20px,#fde,transparent),radial-gradient(1px 1px at 60px 120px,#fff,transparent);
background-size:auto,170px 150px,170px 150px,170px 150px,170px 150px}
:root[data-skin="anime"] :is(.box,details.sb,.bn .bi){backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.petals{display:none;position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:45}
:root[data-skin="anime"] .petals{display:block}
.petals i{position:absolute;top:-20px;width:11px;height:9px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#ffc9e8,#ff7fbf);opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translate(70px,110vh) rotate(420deg)}}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px 16px 120px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:25px;font-weight:800;margin:0;letter-spacing:-.4px}
:root[data-skin="anime"] h1{background:linear-gradient(90deg,#ffb3dc,#8fe9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12px;color:var(--mute);margin-top:1px}
#clock{font-size:13px;font-weight:700;color:var(--mute)}
button{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#0b0b14}
.hero{position:relative;overflow:hidden;margin:16px 0 12px;border:1px solid var(--line);border-radius:calc(var(--r) + 8px);padding:20px 18px;display:flex;gap:18px;align-items:center;
background:radial-gradient(130% 150% at 0% 0%,color-mix(in srgb,var(--c0,var(--acc)) 18%,transparent),transparent 62%),var(--card)}
:root[data-skin="anime"] .hero{border:1px solid transparent;background:radial-gradient(130% 150% at 0% 0%,color-mix(in srgb,var(--c0,var(--acc)) 22%,transparent),transparent 62%) padding-box,linear-gradient(#150e3a,#150e3a) padding-box,linear-gradient(135deg,#ff79c6,#6be9ff) border-box}
.wm{display:none;position:absolute;right:6px;top:-6px;font-size:76px;font-weight:900;color:#ffffff0d;pointer-events:none}
:root[data-skin="anime"] .wm{display:block}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:128px;height:128px;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:var(--sw);stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--c,var(--acc));stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1s linear}
:root[data-skin="anime"] .ring .fg{filter:drop-shadow(0 0 6px var(--c,var(--acc)))}
.mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
#rt{font-weight:800;font-size:27px;line-height:1;display:block}
#rs{display:block;font-size:11px;color:var(--mute);margin-top:5px}
.hi{flex:1;min-width:0;position:relative}
.lb{font-size:12px;color:var(--mute);font-weight:600}
.nm{font-size:24px;font-weight:800;line-height:1.1;margin:3px 0 8px;letter-spacing:-.3px}
.nx{font-size:13px;color:var(--mute)}
.nx b{color:var(--ink);font-weight:700}
.strip{display:flex;gap:2px;height:10px;border-radius:6px;overflow:hidden;position:relative;margin:4px 0}
.strip i{display:block;background:var(--c);min-width:2px}
.strip i.d{opacity:.25}
.mk{position:absolute;top:0;bottom:0;width:3px;background:var(--ink);display:none}
.slab{display:flex;justify-content:space-between;font-size:10px;font-weight:600;color:var(--mute);margin-bottom:16px}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--chem),var(--acc));transition:width .3s}
.ptxt{font-size:12px;color:var(--mute);margin:7px 0 4px}
.part{margin:26px 0 12px;font-weight:800;font-size:20px;letter-spacing:-.3px}
.part small{display:block;font-weight:500;color:var(--mute);font-size:12px;letter-spacing:0;margin-top:1px}
.tl{position:relative;padding-left:62px}
.tl::before{content:"";position:absolute;left:52px;top:6px;bottom:6px;width:2px;border-radius:2px;background:linear-gradient(var(--g1),var(--g2));opacity:.55}
.row{position:relative;margin-bottom:8px}
.t{position:absolute;left:-62px;top:14px;width:44px;text-align:right;font-size:12px;color:var(--mute);font-weight:700;line-height:1.1}
.t em{display:block;font-style:normal;font-size:9px;font-weight:600}
.row::before{content:"";position:absolute;left:-14px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--c);border:2px solid var(--bg)}
.card{display:flex;align-items:center;gap:12px;border:1px solid transparent;border-radius:var(--r);padding:12px;min-height:var(--h);cursor:pointer;user-select:none;position:relative;overflow:hidden;
background:linear-gradient(90deg,color-mix(in srgb,var(--c) 9%,transparent),transparent 60%),var(--card)}
.ic{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--c) 20%,transparent);display:grid;place-items:center;font-size:18px;flex:none}
.ic .lt{font-weight:800;font-size:14px;color:var(--c)}.ic .em{display:none}
:root[data-skin="anime"] .ic .em{display:block}:root[data-skin="anime"] .ic .lt{display:none}
.fl{flex:1;min-width:0}
.nm2{font-weight:700;font-size:15px}
.mt{font-size:12px;color:var(--mute)}
.tag{font-size:9px;border-radius:6px;padding:2px 6px;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);margin-left:6px;font-weight:800;letter-spacing:.3px}
.brk .card{background:transparent;border:1px dashed var(--line);min-height:0;padding:4px 12px;border-radius:10px}
.brk .nm2{font-weight:500;font-size:12px;color:var(--mute)}
.row.brk::before{width:6px;height:6px;left:-12px;top:12px;background:var(--brk)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--mute);flex:none;display:grid;place-items:center;font-size:12px;color:transparent;opacity:.7}
.done .card{opacity:.5}.done .nm2{text-decoration:line-through}
.done .chk{background:var(--chem);border-color:var(--chem);color:#06231c;opacity:1}
.now .card{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
:root[data-skin="anime"] .now .card{box-shadow:0 0 18px color-mix(in srgb,var(--c) 55%,transparent)}
.now .nm2::after{content:"NOW";margin-left:6px;font-size:9px;background:var(--c);color:var(--bg);border-radius:6px;padding:2px 6px;font-weight:800}
.rule{margin-top:30px;text-align:center;font-weight:700;font-size:13px;color:var(--mute)}
.rule b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 12%,transparent),transparent 70%),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-weight:800;font-size:24px;color:var(--c)}
.stat span{font-size:12px;color:var(--mute)}
.wk{display:flex;gap:6px;align-items:flex-end;height:96px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 6px}
.wk div{flex:1;text-align:center;font-size:10px;font-weight:600;color:var(--mute)}
.wk i{display:block;background:var(--chem);border-radius:5px 5px 0 0;min-height:3px;margin-bottom:4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.ed{display:grid;grid-template-columns:1fr 92px;gap:6px 10px;align-items:center;font-size:13px;margin-top:8px}
input[type=text],input[type=number],input[type=time]{background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;width:100%}
details.sb{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,transparent),transparent 55%),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:8px}
details.sb summary,.box summary{font-weight:800;font-size:15px;cursor:pointer;display:flex;justify-content:space-between}
details.sb summary span:first-child{color:var(--c)}
.tpi{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;cursor:pointer}
.tpi input{width:18px;height:18px;padding:0}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 120px;transform:translateY(100%);visibility:hidden;transition:transform .25s,visibility .25s}
.sheet.on{transform:none;visibility:visible}
.sheet .in{max-width:520px;margin:0 auto}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:24px;font-weight:800;letter-spacing:-.4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.fcn{text-align:center;padding-top:9vh}
.fnm{font-size:28px;font-weight:800;margin:6px 0 20px}
.ft{font-weight:800;font-size:min(20vw,92px);line-height:1}
#fbar{display:block;height:100%;width:0;background:var(--acc)}
.bn{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;padding:18px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 55%);pointer-events:none}
.bn .bi{pointer-events:auto;display:flex;width:100%;max-width:520px;background:var(--card2);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 8px 28px #0006}
.bn button{flex:1;background:none;border:0;border-radius:18px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:10px;font-weight:700}
.bn button.on{color:var(--acc)}
.bn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero,.strip,.slab,.prog,.ptxt,.part{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.strip{animation-delay:.08s}.slab{animation-delay:.1s}.prog{animation-delay:.14s}.ptxt{animation-delay:.16s}.part{animation-delay:.2s}
.row{animation:up .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.22s + var(--i,0)*.035s)}
.card{transition:transform .12s}.card:active{transform:scale(.982)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 16%,transparent)}50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--c) 5%,transparent)}}
@keyframes pulseA{0%,100%{box-shadow:0 0 12px color-mix(in srgb,var(--c) 45%,transparent)}50%{box-shadow:0 0 28px color-mix(in srgb,var(--c) 80%,transparent)}}
.now .card{animation:pulse 2.4s ease-in-out infinite}
:root[data-skin="anime"] .now .card{animation:pulseA 2.4s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.done .chk{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.nm.sw{animation:swap .5s cubic-bezier(.2,.7,.2,1) both}
.pt{position:fixed;z-index:70;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:burst .85s cubic-bezier(.2,.8,.3,1) forwards}
:root[data-skin="anime"] .pt{border-radius:100% 0 100% 0}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(260deg) scale(.2);opacity:0}}
.bn .bi{position:relative}
.pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:18px;background:color-mix(in srgb,var(--acc) 20%,transparent);transition:transform .38s cubic-bezier(.3,1.35,.5,1),width .3s}
.bn button{position:relative}
.sheet.on .in>*{animation:up .45s cubic-bezier(.2,.7,.2,1) both}
.sheet.on .in>*:nth-child(2){animation-delay:.05s}.sheet.on .in>*:nth-child(3){animation-delay:.1s}.sheet.on .in>*:nth-child(4){animation-delay:.15s}.sheet.on .in>*:nth-child(5){animation-delay:.2s}
.ss{display:none;position:fixed;top:80px;left:-120px;width:90px;height:2px;background:linear-gradient(90deg,transparent,#fff);pointer-events:none;z-index:2;opacity:0}
:root[data-skin="anime"] .ss{display:block;animation:shoot 13s linear infinite 3s}
@keyframes shoot{0%{transform:translate(0,0) rotate(24deg);opacity:0}2%{opacity:1}9%{transform:translate(560px,250px) rotate(24deg);opacity:0}100%{opacity:0}}
html{-webkit-text-size-adjust:100%}
button,.card{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#clock,button#fb{white-space:nowrap}
#rt.sm{font-size:20px}
@media (max-width:360px){h1{font-size:21px}.ring,.ring svg{width:108px;height:108px}#rt{font-size:23px}#rt.sm{font-size:17px}.hero{gap:12px;padding:16px 14px}.nm{font-size:21px}.sh{font-size:21px}}
.psec{margin:20px 0 8px;font-weight:800;font-size:16px}
.fr{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.blk{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.pbox{border-left:4px solid var(--acc);padding-left:10px;margin-bottom:18px}
.r1,.r2{display:flex;gap:6px;align-items:center}.r2{margin-top:8px;flex-wrap:wrap}
.r1 input[type=text]{flex:1;min-width:0}
.dot{width:28px;height:28px;border-radius:50%;background:var(--c);border:2px solid var(--bg);outline:2px solid var(--line);padding:0;flex:none}
button.bt{padding:6px 10px;font-size:13px;flex:none}
select{background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:13px}
textarea{width:100%;min-height:96px;background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;margin-top:8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.petals,.ss{display:none!important}}
</style>
</head>
<body>
<noscript>This page needs JavaScript to run.</noscript>
<div class="wrap">
<div class="top"><div><h1 id="ttl">Study Timetable</h1><div class="sub" id="sbt">SSC GD 2027</div></div><div class="tr"><span id="clock"></span></div></div>
<div class="hero"><div class="wm">勉強</div>
 <div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="fg" cx="60" cy="60" r="54"/></svg>
 <div class="mid"><div><span id="rt">--</span><span id="rs"></span></div></div></div>
 <div class="hi"><div class="lb" id="lb">Right now</div><div class="nm" id="nm">-</div><div class="nx" id="el"></div><div class="nx" id="nx"></div><button id="fb" style="margin-top:10px">Focus mode</button></div>
</div>
<div class="strip" id="strip"><div class="mk" id="mk"></div></div>
<div class="slab" id="slab"></div>
<div class="prog"><i id="bar"></i></div>
<div class="ptxt" id="ptxt"></div>
<div id="app"></div>
<div class="rule"><b>Focus</b> → <b>Revise</b> → <b>Test</b> → <b>Rest</b></div>
</div>

<section class="sheet" id="s-topics"><div class="in"><div class="sh"><span>Topics</span><button class="x">Close</button></div><div id="tp"></div></div></section>

<section class="sheet" id="s-mock"><div class="in"><div class="sh"><span>Mock scores</span><button class="x">Close</button></div>
<div class="box" style="--c:var(--test)"><div class="ed" style="grid-template-columns:1fr 1fr auto;margin-top:0"><input id="ms" type="number" placeholder="Marks" min="0" aria-label="Marks scored"><input id="mt2" type="number" value="160" min="1" aria-label="Out of"><button class="pri" id="ma">Add</button></div>
<div class="wk" id="mg" style="margin-top:12px"></div><div class="mt" id="mi" style="margin-top:8px"></div><button id="mu" style="margin-top:8px">Remove last</button></div>
</div></section>

<section class="sheet" id="s-prog"><div class="in"><div class="sh"><span>Progress</span><button class="x">Close</button></div>
<div class="stats" id="stats"></div>
<div class="part" style="margin-top:8px">Last 7 days</div><div class="wk" id="wk"></div>
</div></section>

<section class="sheet" id="s-focus"><div class="in"><div class="sh"><span>Focus</span><button class="x">Close</button></div>
<div class="fcn"><div class="mt" id="flb"></div><div class="fnm" id="fnm"></div><div class="ft" id="ft">--</div><div class="prog" style="margin:18px 0"><i id="fbar"></i></div><div class="mt" id="fnx"></div></div>
</div></section>

<section class="sheet" id="s-set"><div class="in"><div class="sh"><span>Settings</span><button class="x">Close</button></div>
<button class="pri" id="edit" style="width:100%;padding:14px;margin-bottom:6px">Edit timetable and subjects</button>
<div class="psec">Theme</div>
<div class="g2"><button class="skb" data-v="study">Study</button><button class="skb" data-v="anime">Anime</button></div>
<div class="g2"><button id="nt">Turn on reminders</button><button id="reset">Reset today</button></div>
<div class="box"><div class="psec" style="margin-top:0">Backup and share</div><div class="mt">Copy your plan to share it, or paste a plan or full backup below and import it.</div>
<textarea id="bk" placeholder="Paste here to import" style="margin-top:8px"></textarea>
<div class="g2" style="margin:8px 0 0"><button id="bkc">Copy plan</button><button id="bkf">Copy full backup</button></div>
<button id="bki" style="width:100%;margin-top:8px">Import pasted data</button></div>
<div class="box"><div class="psec" style="margin-top:0">Templates</div><div class="g2" style="margin:0"><button id="tdef">SSC GD sample</button><button id="tblank">Blank plan</button></div></div>
</div></section>

function burst(el,color){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;

function paint(){
 const now=new Date(),m=((now.getHours()*60+now.getMinutes())-C.wake+1440)%1440,N=ids.length;

 let h="";const wd=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
 for(let i=6;i>=0;i--){const dd=new Date(Date.now()-12*36e5-i*864e5);h+='<div><i style="height:'+Math.round(cnt(i)*64)+'px"></i>'+wd[dd.getDay()]+'</div>'}
